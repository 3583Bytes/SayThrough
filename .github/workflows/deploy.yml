name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # deploy-pages v4+ requires this
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The full symbol library is committed (~146 MB), so there is nothing
      # to fetch — the picker can search all 13,799 images on any clone or
      # deploy. Kept out of a release asset deliberately: the release step was
      # skipped whenever the release did not exist, which shipped a board full
      # of broken images without failing the build.

      # Enhanced neural voice model (§10.5). Fetched straight from its source
      # — one file from a stable public URL, ~20s — rather than staged through
      # a release asset. The symbol library is staged that way because it is
      # assembled from ~13,800 individual API calls; this is not, and making a
      # human run `gh release create` before the feature works was a pattern
      # copied from a situation that did not apply.
      #
      # Cached between runs so a normal deploy does not re-download it.
      - name: Restore cached voice model
        id: voice-cache
        uses: actions/cache@v5
        with:
          path: public/voices
          key: voice-en_US-hfc_female-medium-es_ES-sharvard-medium-v1

      - name: Fetch enhanced voice models
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: |
          # Fails the deploy on purpose. Warning and carrying on is how the
          # enhanced voice sat dead in production for days behind a green
          # build — shipping a feature that silently does not work is worse
          # than not shipping the change at all. Retry the run if the source
          # was briefly unavailable.
          #
          # One model PER LANGUAGE (§19.7). Devices fetch only the one their
          # profile needs, but the site has to carry both or the Spanish
          # enhanced voice 404s exactly the way the English one used to.
          npm run voice
          npm run voice:es
          echo "voice files: $(ls public/voices | wc -l)"

      # Served at the saythrough.com root (custom domain), so NO base-path
      # prefix — this makes the deployed bundle identical to the local/CI
      # build. public/CNAME keeps the custom domain across deploys. (For a
      # github.io project-page deploy instead, set EXPO_BASE_URL and
      # EXPO_PUBLIC_BASE_URL to /<repo> here.)
      - name: Build web (export + PWA postbuild)
        run: npm run build

      # Pages must be enabled ONCE by an admin (Settings → Pages → Source:
      # GitHub Actions, or `gh api --method POST repos/OWNER/REPO/pages
      # -f build_type=workflow`). The Actions token can't create the site
      # itself, so we don't pass enablement:true — this step just reads the
      # existing Pages config.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

      # A green build is not the same as a working site. This fetches the
      # deployed URLs and fails if anything the app needs is missing —
      # including the case where Pages answers a missing file with the SPA
      # shell, which a status-code check would happily accept.
      - name: Verify the deployed site
        run: node scripts/check-deploy.mjs "${{ steps.deployment.outputs.page_url || 'https://saythrough.com' }}"

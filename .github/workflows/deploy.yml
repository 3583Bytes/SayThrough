name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Full symbol library ships as a release asset (never in git).
      # continue-on-error: deploys still work with the committed seed
      # subset until the symbols-v1 release exists.
      - name: Fetch full symbol library
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download symbols-v1 --pattern 'saythrough-symbols.tar.gz' --output /tmp/symbols.tar.gz
          mkdir -p public/symbols
          tar -xzf /tmp/symbols.tar.gz -C public/symbols
          # the tar carries the full search index — promote it to the app root
          mv public/symbols/symbolIndex.json public/symbolIndex.json
          echo "symbols in build: $(ls public/symbols/arasaac | wc -l)"

      - name: Build web (export + PWA postbuild)
        run: npm run build
        env:
          EXPO_BASE_URL: /saythrough
          EXPO_PUBLIC_BASE_URL: /saythrough

      # enablement:true turns on Pages via the API if it isn't already,
      # so the workflow is self-sufficient (also enable it once under
      # Settings → Pages → Source: GitHub Actions).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Full symbol library ships as a release asset (never in git — ~165 MB).
      # A missing release is EXPECTED before it is first published, so it is
      # reported as a notice; a release that exists but fails to download is a
      # real problem and fails the deploy. `continue-on-error` used to hide
      # both cases behind the same red "exit code 1".
      - name: Fetch full symbol library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view symbols-v1 >/dev/null 2>&1; then
            echo "::notice::No symbols-v1 release yet — building with the $(git ls-files public/symbols | wc -l | tr -d ' ') committed seed symbols."
            exit 0
          fi
          gh release download symbols-v1 --pattern 'saythrough-symbols.tar.gz' --output /tmp/symbols.tar.gz
          mkdir -p public/symbols
          tar -xzf /tmp/symbols.tar.gz -C public/symbols
          # the tar carries the full search index — promote it to the app root
          mv public/symbols/symbolIndex.json public/symbolIndex.json
          echo "symbols in build: $(ls public/symbols/arasaac | wc -l)"

      # Enhanced neural voice model (§10.5) — ~60 MB, also never in git.
      # Without it the app is fully functional: ttsService falls back to the
      # platform voice, and Settings reports that the enhanced voice is
      # unavailable rather than failing silently.
      - name: Fetch enhanced voice model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view voice-v1 >/dev/null 2>&1; then
            echo "::notice::No voice-v1 release yet — the enhanced voice will be offered but unavailable."
            exit 0
          fi
          mkdir -p public/voices
          gh release download voice-v1 --pattern '*.onnx*' --dir public/voices
          echo "voice files in build: $(ls public/voices | wc -l)"

      # Served at the saythrough.com root (custom domain), so NO base-path
      # prefix — this makes the deployed bundle identical to the local/CI
      # build. public/CNAME keeps the custom domain across deploys. (For a
      # github.io project-page deploy instead, set EXPO_BASE_URL and
      # EXPO_PUBLIC_BASE_URL to /<repo> here.)
      - name: Build web (export + PWA postbuild)
        run: npm run build

      # Pages must be enabled ONCE by an admin (Settings → Pages → Source:
      # GitHub Actions, or `gh api --method POST repos/OWNER/REPO/pages
      # -f build_type=workflow`). The Actions token can't create the site
      # itself, so we don't pass enablement:true — this step just reads the
      # existing Pages config.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

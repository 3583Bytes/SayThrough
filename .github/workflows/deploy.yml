name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The full symbol library is committed (~146 MB), so there is nothing
      # to fetch — the picker can search all 13,799 images on any clone or
      # deploy. Kept out of a release asset deliberately: the release step was
      # skipped whenever the release did not exist, which shipped a board full
      # of broken images without failing the build.

      # Enhanced neural voice model (§10.5) — ~60 MB, also never in git.
      # Without it the app is fully functional: ttsService falls back to the
      # platform voice, and Settings reports that the enhanced voice is
      # unavailable rather than failing silently.
      - name: Fetch enhanced voice model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view voice-v1 >/dev/null 2>&1; then
            echo "::warning::No voice-v1 release — the enhanced voice will be UNAVAILABLE on the deployed site. Publish it with: gh release create voice-v1 public/voices/en_US-hfc_female-medium.onnx public/voices/en_US-hfc_female-medium.onnx.json"
            exit 0
          fi
          mkdir -p public/voices
          gh release download voice-v1 --pattern '*.onnx*' --dir public/voices
          echo "voice files in build: $(ls public/voices | wc -l)"

      # Served at the saythrough.com root (custom domain), so NO base-path
      # prefix — this makes the deployed bundle identical to the local/CI
      # build. public/CNAME keeps the custom domain across deploys. (For a
      # github.io project-page deploy instead, set EXPO_BASE_URL and
      # EXPO_PUBLIC_BASE_URL to /<repo> here.)
      - name: Build web (export + PWA postbuild)
        run: npm run build

      # Pages must be enabled ONCE by an admin (Settings → Pages → Source:
      # GitHub Actions, or `gh api --method POST repos/OWNER/REPO/pages
      # -f build_type=workflow`). The Actions token can't create the site
      # itself, so we don't pass enablement:true — this step just reads the
      # existing Pages config.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # A green build is not the same as a working site. This fetches the
      # deployed URLs and fails if anything the app needs is missing —
      # including the case where Pages answers a missing file with the SPA
      # shell, which a status-code check would happily accept.
      - name: Verify the deployed site
        run: node scripts/check-deploy.mjs "${{ steps.deployment.outputs.page_url || 'https://saythrough.com' }}"

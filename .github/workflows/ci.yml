name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catches vocabulary that references a symbol with no committed image —
      # invisible locally, where the full library is synced, but broken in
      # production.
      - name: Symbol coverage
        run: node scripts/symbols/check-seed-coverage.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: E2E tests
        # dist/ is already built above; Playwright's webServer serves it
        run: npx playwright test --project=chromium

      # Firefox runs the platform-sensitive specs only (see playwright.config).
      - name: E2E tests (Firefox)
        run: npx playwright test --project=firefox

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
